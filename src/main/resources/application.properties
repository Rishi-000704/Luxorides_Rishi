spring.application.name=FLEETOVO-CORE-SERVICE

server.port=${SERVER_PORT:8443}

server.tomcat.basedir=${FILE_BASE_PATH:/srv/fleetovo-files}
filepath=${FILE_BASE_PATH:/srv/fleetovo-files}

spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=5000MB

fleetovo.secrets.master-key=${FLEETOVO_SECRET_MASTER_KEY}

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=2592000000

# Signs short-lived GET /file/{filename} access tokens (FileAccessTokenService).
# No new required env var: falls back to reusing JWT_SECRET when FILE_TOKEN_SECRET
# isn't set, so this doesn't require a .env change. A distinct "purpose" claim on
# the token itself still keeps it from being usable as an auth JWT or vice versa.
security.file-token.secret-key=${FILE_TOKEN_SECRET:${security.jwt.secret-key}}

app.seed.enabled=false

google.maps.api-key=${GOOGLE_MAPS_KEY}
google.airport.radius-meters=2000

ors.api-key=${ORS_API_KEY}

# Optional. Path to a Firebase service-account JSON file. When unset, FcmPushService
# no-ops (logs and returns) instead of failing -- no Firebase project is configured
# for this deployment yet, so push notifications are code-complete but not live.
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

resilience4j.retry.instances.googleGeo.max-attempts=2
resilience4j.retry.instances.googleGeo.wait-duration=500ms

resilience4j.circuitbreaker.instances.googleGeo.sliding-window-size=10
resilience4j.circuitbreaker.instances.googleGeo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.googleGeo.wait-duration-in-open-state=30s

resilience4j.retry.instances.orsDistance.max-attempts=2
resilience4j.retry.instances.orsDistance.wait-duration=500ms

resilience4j.circuitbreaker.instances.orsDistance.sliding-window-size=10
resilience4j.circuitbreaker.instances.orsDistance.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orsDistance.wait-duration-in-open-state=30s


# Return sanitized technical details for frontend console diagnostics.
fleetovo.errors.expose-technical-message=true

# Add trace ID to every backend log entry.
logging.pattern.level=%5p [traceId=%X{traceId:-none}]

# Report configuration
report.generation.queued-timeout=2m
report.generation.processing-timeout=10m
report.generation.max-attempts=3
report.generation.timezone=Asia/Kolkata
report.generation.executor-core-pool-size=2
report.generation.executor-max-pool-size=4
report.generation.executor-queue-capacity=50