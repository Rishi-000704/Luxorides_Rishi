spring.application.name=FLEETOVO-CORE-SERVICE

server.port=${SERVER_PORT:8443}

server.tomcat.basedir=${FILE_BASE_PATH:/srv/fleetovo-files}
filepath=${FILE_BASE_PATH:/srv/fleetovo-files}

spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=5000MB

fleetovo.secrets.master-key=${FLEETOVO_SECRET_MASTER_KEY}

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=2592000000

# Comma-separated exact frontend origins allowed to make cross-origin
# requests to this API (e.g. https://customer.example.com,https://fleetovo.example.com).
# Required, no default -- deliberately not a permissive fallback like "*",
# so a deployment that forgets to set this fails to start instead of
# silently allowing every origin. Local development sets this to its own
# dev-server origin(s), e.g. http://localhost:3000,http://localhost:4200.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Signs short-lived GET /file/{filename} access tokens (FileAccessTokenService).
# No new required env var: falls back to reusing JWT_SECRET when FILE_TOKEN_SECRET
# isn't set, so this doesn't require a .env change. A distinct "purpose" claim on
# the token itself still keeps it from being usable as an auth JWT or vice versa.
security.file-token.secret-key=${FILE_TOKEN_SECRET:${security.jwt.secret-key}}

app.seed.enabled=false

# Public base URL used to build driver-duty links (ExternalDriverDutyService).
# Required, no default -- deliberately not falling back to a sandbox/dev
# domain, so a deployment that forgets to set this fails to start instead of
# silently sending drivers sandbox links. Local development sets this to its
# own dev/sandbox value in .env.
driver.duty.public-url=${DRIVER_DUTY_PUBLIC_URL}

# Chauffeur app force-update gate (AppVersionService / PublicAppVersionController,
# GET /public/app/version). Defaults match app.json's current published
# version, i.e. a no-op until deliberately raised -- no .env change required
# to deploy this feature. Raising CHAUFFEUR_MIN_SUPPORTED_VERSION is the one
# lever that forces an update; CHAUFFEUR_LATEST_VERSION is advisory only.
app.chauffeur.min-supported-version=${CHAUFFEUR_MIN_SUPPORTED_VERSION:1.0.0}
app.chauffeur.latest-version=${CHAUFFEUR_LATEST_VERSION:1.0.0}

google.maps.api-key=${GOOGLE_MAPS_KEY}
google.airport.radius-meters=2000

ors.api-key=${ORS_API_KEY}

# Optional. Path to a Firebase service-account JSON file, used only for Android
# push (Firebase Admin/FCM). When unset, PushNotificationService's Firebase
# transport no-ops (logs and returns) instead of failing -- no Firebase project
# is configured for this deployment yet, so Android push is code-complete but
# not live. iOS push is unaffected by this property: it's relayed through
# Expo's push service (https://exp.host), which needs no backend credential
# for a basic send -- see PushNotificationService and its final report.
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

resilience4j.retry.instances.googleGeo.max-attempts=2
resilience4j.retry.instances.googleGeo.wait-duration=500ms

resilience4j.circuitbreaker.instances.googleGeo.sliding-window-size=10
resilience4j.circuitbreaker.instances.googleGeo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.googleGeo.wait-duration-in-open-state=30s

resilience4j.retry.instances.orsDistance.max-attempts=2
resilience4j.retry.instances.orsDistance.wait-duration=500ms

resilience4j.circuitbreaker.instances.orsDistance.sliding-window-size=10
resilience4j.circuitbreaker.instances.orsDistance.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orsDistance.wait-duration-in-open-state=30s

# GoogleGeoProvider#calculateDistanceAndTime is annotated @Retry(name =
# "googleDistance")/@CircuitBreaker(name = "googleDistance") -- a distinct
# instance from "googleGeo" (which only governs resolveState/isAirport).
# Without this block that call ran under Resilience4j's untuned library
# defaults; values mirror the already-reviewed googleGeo/orsDistance settings
# above rather than inventing new ones.
resilience4j.retry.instances.googleDistance.max-attempts=2
resilience4j.retry.instances.googleDistance.wait-duration=500ms

resilience4j.circuitbreaker.instances.googleDistance.sliding-window-size=10
resilience4j.circuitbreaker.instances.googleDistance.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.googleDistance.wait-duration-in-open-state=30s

# Bounds ORS/Google routing HTTP calls (GoogleMapsClientConfig,
# OpenRouteServiceClientConfig) so a hung upstream call can't stall duty
# closure/billing indefinitely -- GeoProviderChain treats any failure,
# including a timeout, as "try the next provider in the chain."
geo.http.connect-timeout-ms=${GEO_HTTP_CONNECT_TIMEOUT_MS:5000}
geo.http.response-timeout-ms=${GEO_HTTP_RESPONSE_TIMEOUT_MS:8000}

# Return sanitized technical details for frontend console diagnostics.
# Defaults to false (production-safe) -- set EXPOSE_TECHNICAL_ERROR_MESSAGE=true
# only in an environment where that's an intentional, explicit choice (e.g.
# local development), never silently in production.
fleetovo.errors.expose-technical-message=${EXPOSE_TECHNICAL_ERROR_MESSAGE:false}

# Add trace ID to every backend log entry.
logging.pattern.level=%5p [traceId=%X{traceId:-none}]

# Actuator was relying on Spring Boot's own default exposure (health, info
# only) -- /actuator/** is permitAll in SecurityConfiguration, so that
# default was the only thing standing between an unauthenticated caller and
# anything wider (env, beans, heapdump) if one were ever added later without
# also revisiting that permitAll rule. Pinning the current safe default
# explicitly here changes no behavior today; it only stops that default from
# silently widening.
management.endpoints.web.exposure.include=health,info

# Report configuration
report.generation.queued-timeout=2m
report.generation.processing-timeout=10m
report.generation.max-attempts=3
report.generation.timezone=Asia/Kolkata
report.generation.executor-core-pool-size=2
report.generation.executor-max-pool-size=4
report.generation.executor-queue-capacity=50