<div th:fragment="invoiceHeader"
     class="invoice-part avoid-break">

  <table style="
		width:100%;
		border-collapse:collapse;
		margin-bottom:30px;
	">

    <tr>

      <!-- Logo -->
      <td style="
				width:50%;
				vertical-align:top;
			">

        <img
                th:if="${invoiceLogoUri != null}"
                th:src="${invoiceLogoUri}"
                style="
						max-height:120px;
						max-width:260px;
					"
                alt="Invoice logo"
        />

      </td>

      <!-- Company Info -->
      <td
              th:if="${orgEntity != null}"
              style="
					width:50%;
					vertical-align:top;
					text-align:right;
					font-size:11px;
				"
      >

        <div
                style="
						font-weight:bold;
						font-size:12px;
					"
                th:text="${orgEntity.legalName}">
        </div>

        <div
                th:if="${orgAddress != null}"
                th:text="${orgAddress}">
        </div>

        <div
                th:if="${orgPhones != null}"
                th:text="${orgPhones}">
        </div>

        <div
                th:if="${orgEntity.gstin != null
						and !#strings.isEmpty(orgEntity.gstin)}"
        >

          <strong>GSTIN:</strong>

          <span
                  th:text="${orgEntity.gstin}">
					</span>

        </div>

      </td>

    </tr>

  </table>

</div>
