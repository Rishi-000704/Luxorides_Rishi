<div th:fragment="invoiceTotals" class="invoice-part avoid-break">

	<!-- OUTER LAYOUT TABLE -->
	<table
			style="width: 100%; border-collapse: collapse; margin-top: 10px;">
		<tr>

			<!-- LEFT: HSN -->
			<td style="width: 50%; vertical-align: top; padding-right: 10px;">

				<table
						style="width: 100%; border-collapse: collapse; margin-top: 20px; text-align: center; font-size: 11px;">
					<thead>
					<tr>
						<th
								style="border: 1px solid #000; padding: 5px; font-weight: bold;">
							HSN/SAC
						</th>

						<th
								style="border: 1px solid #000; padding: 5px; font-weight: bold;">
							Taxable Amount
						</th>
					</tr>
					</thead>

					<tbody>
					<tr>
						<td style="border: 1px solid #000; padding: 5px;">
							996601
						</td>

						<td
								style="border: 1px solid #000; padding: 5px;"
								th:text="'₹' + ${invoice.taxableAmount.amount}">
							₹0.00
						</td>
					</tr>
					</tbody>
				</table>

			</td>

			<!-- RIGHT: TOTALS -->
			<td style="width: 50%; vertical-align: top; padding-left: 10px;">

				<table
						style="width: 100%; border-collapse: collapse; font-size: 11px;">

					<!-- SUBTOTAL -->
					<tr>
						<td
								style="padding: 6px 10px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold;">
							Subtotal
						</td>

						<td
								style="padding: 6px 10px; border: 1px solid #ccc; text-align: right;"
								th:text="'₹' + ${invoice.subtotal.amount}">
							₹0.00
						</td>
					</tr>

					<!-- DISCOUNT -->
					<tr
							th:if="${invoice.discount != null
							and invoice.discount.amount != null
							and invoice.discount.amount > 0}">

						<td
								style="padding: 6px 10px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold;">
							Discount
						</td>

						<td
								style="padding: 6px 10px; border: 1px solid #ccc; text-align: right;"
								th:text="'₹' + ${invoice.discount.amount}">
							₹0.00
						</td>
					</tr>

					<!-- TAXABLE AMOUNT -->
					<tr>
						<td
								style="padding: 6px 10px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold;">
							Taxable Amount
						</td>

						<td
								style="padding: 6px 10px; border: 1px solid #ccc; text-align: right;"
								th:text="'₹' + ${invoice.taxableAmount.amount}">
							₹0.00
						</td>
					</tr>

					<!-- IGST -->
					<tr th:if="${hasIgst}">
						<td
								style="padding: 6px 10px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold;"
								th:text="|IGST @ ${igstRate}%|">
							IGST @ 5%
						</td>

						<td
								style="padding: 6px 10px; border: 1px solid #ccc; text-align: right;"
								th:text="'₹' + ${igstAmount}">
							₹0.00
						</td>
					</tr>

					<!-- CGST -->
					<tr th:if="${hasCgst}">
						<td
								style="padding: 6px 10px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold;"
								th:text="|CGST @ ${cgstRate}%|">
							CGST @ 2.5%
						</td>

						<td
								style="padding: 6px 10px; border: 1px solid #ccc; text-align: right;"
								th:text="'₹' + ${cgstAmount}">
							₹0.00
						</td>
					</tr>

					<!-- SGST -->
					<tr th:if="${hasSgst}">
						<td
								style="padding: 6px 10px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold;"
								th:text="|SGST @ ${sgstRate}%|">
							SGST @ 2.5%
						</td>

						<td
								style="padding: 6px 10px; border: 1px solid #ccc; text-align: right;"
								th:text="'₹' + ${sgstAmount}">
							₹0.00
						</td>
					</tr>

					<!-- GRAND TOTAL -->
					<tr>
						<td
								style="padding: 6px 10px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold; font-size: 14px;">
							Grand Total
						</td>

						<td
								style="padding: 6px 10px; border: 1px solid #ccc; text-align: right; font-size: 14px; font-weight: bold;"
								th:text="'₹' + ${invoice.grandTotal.amount}">
							₹0.00
						</td>
					</tr>

					<!-- PAYMENTS -->
					<tr th:each="p : ${payments}">

						<td style="
		padding:6px 10px;
		border:1px solid #ccc;
		font-weight:bold;
	">

		<span
				th:text="${p.title}">
		</span>

							<th:block
									th:if="${p.dateLine != null}"
							>

								<br />

								<span
										th:text="${p.dateLine}"
										style="
					font-size:9px;
					color:#777;
				">
			</span>

							</th:block>

						</td>

						<td
								style="
			padding:6px 10px;
			border:1px solid #ccc;
			text-align:right;
		"
								th:text="'₹' + ${p.amount}">
							₹0.00
						</td>

					</tr>

					<!-- PAYABLE AMOUNT -->
					<tr th:if="${pendingAmount != null}">
						<td
								style="padding: 6px 10px; border: 1px solid #ccc; background: #e0e0e0; font-weight: bold; color: #00334e; font-size: 14px;">
							Payable Amount
						</td>

						<td
								style="padding: 6px 10px; border: 1px solid #ccc; text-align: right; color: #00334e; font-size: 14px; font-weight: bold;"
								th:text="'₹' + ${pendingAmount}">
							₹0.00
						</td>
					</tr>

				</table>

			</td>
		</tr>
	</table>

	<!-- AMOUNT IN WORDS -->
	<div
			th:if="${amountInWords != null and !#strings.isEmpty(amountInWords)}"
			style="background: #e0e0e0; padding: 8px; margin-top: 15px; font-size: 11px; border: 1px solid #ccc;">

		<strong>In Words: </strong>

		<span th:text="${amountInWords}"></span>
	</div>

</div>
