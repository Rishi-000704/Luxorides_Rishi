<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Tax Invoice</title>

	<style>

		/*
		 * PDF page spacing must be controlled using @page rather
		 * than body padding.
		 *
		 * Body padding participates in OpenHTMLToPDF pagination
		 * and can create an otherwise blank trailing page.
		 */
		@page {
			margin: 50px;
		}

		@font-face {
			font-family: 'Montserrat';
			src: url('Montserrat-Regular.ttf') format('truetype');
			font-weight: 400;
		}

		@font-face {
			font-family: 'Montserrat';
			src: url('Montserrat-SemiBold.ttf') format('truetype');
			font-weight: 600;
		}

		@font-face {
			font-family: 'Montserrat';
			src: url('Montserrat-Bold.ttf') format('truetype');
			font-weight: 700;
		}

		.invoice-part {
			width: 100%;
		}

		.avoid-break {
			page-break-inside: avoid;
		}

		/* ==========================================================
		   QUILL RICH TEXT — INVOICE TERMS
		   ========================================================== */

		.invoice-terms {
			color: #444444;
			font-family: 'Montserrat', sans-serif;
			font-size: 10px;
			line-height: 1.5;
			margin: 0 0 20px 0;
			padding: 0;
		}

		/* ==========================================================
		   BLOCKS
		   ========================================================== */

		.invoice-terms p {
			margin: 0 0 6px 0;
			padding: 0;
		}

		.invoice-terms div {
			margin: 0 0 6px 0;
			padding: 0;
		}

		.invoice-terms h1 {
			font-size: 2em;
			font-weight: 700;
			line-height: 1.2;
			margin: 10px 0 6px 0;
		}

		.invoice-terms h2 {
			font-size: 1.5em;
			font-weight: 700;
			line-height: 1.25;
			margin: 9px 0 5px 0;
		}

		.invoice-terms h3 {
			font-size: 1.25em;
			font-weight: 700;
			line-height: 1.3;
			margin: 8px 0 5px 0;
		}

		.invoice-terms h4 {
			font-size: 1.1em;
			font-weight: 700;
			line-height: 1.3;
			margin: 7px 0 4px 0;
		}

		.invoice-terms h5 {
			font-size: 1em;
			font-weight: 700;
			line-height: 1.3;
			margin: 6px 0 4px 0;
		}

		.invoice-terms h6 {
			font-size: 0.9em;
			font-weight: 700;
			line-height: 1.3;
			margin: 6px 0 4px 0;
		}

		/* ==========================================================
		   INLINE FORMATTING
		   ========================================================== */

		.invoice-terms strong,
		.invoice-terms b {
			font-weight: 700;
		}

		.invoice-terms em,
		.invoice-terms i {
			font-style: italic;
		}

		.invoice-terms u {
			text-decoration: underline;
		}

		.invoice-terms s,
		.invoice-terms strike {
			text-decoration: line-through;
		}

		.invoice-terms sub {
			font-size: 75%;
			vertical-align: sub;
		}

		.invoice-terms sup {
			font-size: 75%;
			vertical-align: super;
		}

		/* ==========================================================
		   BLOCKQUOTE
		   ========================================================== */

		.invoice-terms blockquote {
			border-left: 3px solid #cccccc;
			color: #555555;
			margin: 8px 0;
			padding: 4px 0 4px 10px;
		}

		/* ==========================================================
		   LISTS
		   ========================================================== */

		.invoice-terms ol {
			list-style-type: decimal;
			margin: 5px 0 8px 0;
			padding-left: 24px;
		}

		.invoice-terms ul {
			list-style-type: disc;
			margin: 5px 0 8px 0;
			padding-left: 24px;
		}

		.invoice-terms li {
			margin: 0 0 3px 0;
			padding: 0;
		}

		.invoice-terms li[data-list="ordered"] {
			list-style-type: decimal;
		}

		.invoice-terms li[data-list="bullet"] {
			list-style-type: disc;
		}

		/* Quill checklist */

		.invoice-terms li[data-list="checked"],
		.invoice-terms li[data-list="unchecked"] {
			list-style-type: none;
		}

		.invoice-terms li[data-list="checked"]:before {
			content: "[x] ";
			font-weight: 700;
		}

		.invoice-terms li[data-list="unchecked"]:before {
			content: "[ ] ";
			font-weight: 700;
		}

		/* ==========================================================
		   ALIGNMENT
		   ========================================================== */

		.invoice-terms .ql-align-left {
			text-align: left;
		}

		.invoice-terms .ql-align-center {
			text-align: center;
		}

		.invoice-terms .ql-align-right {
			text-align: right;
		}

		.invoice-terms .ql-align-justify {
			text-align: justify;
		}

		/* ==========================================================
		   DIRECTION
		   ========================================================== */

		.invoice-terms .ql-direction-rtl {
			direction: rtl;
		}

		/* ==========================================================
		   FONT SIZE
		   ========================================================== */

		.invoice-terms .ql-size-small {
			font-size: 0.75em;
		}

		.invoice-terms .ql-size-normal {
			font-size: 1em;
		}

		.invoice-terms .ql-size-large {
			font-size: 1.5em;
		}

		.invoice-terms .ql-size-huge {
			font-size: 2.5em;
		}

		/* ==========================================================
		   FONT FAMILY
		   ========================================================== */

		/*
		 * Default Quill text has no font class and therefore uses
		 * Montserrat from .invoice-terms.
		 */

		.invoice-terms .ql-font-sans-serif {
			font-family: 'Montserrat', sans-serif;
		}

		.invoice-terms .ql-font-serif {
			font-family: serif;
		}

		.invoice-terms .ql-font-monospace {
			font-family: monospace;
		}

		/* ==========================================================
		   INDENTATION
		   ========================================================== */

		.invoice-terms .ql-indent-1 {
			margin-left: 3em;
		}

		.invoice-terms .ql-indent-2 {
			margin-left: 6em;
		}

		.invoice-terms .ql-indent-3 {
			margin-left: 9em;
		}

		.invoice-terms .ql-indent-4 {
			margin-left: 12em;
		}

		.invoice-terms .ql-indent-5 {
			margin-left: 15em;
		}

		.invoice-terms .ql-indent-6 {
			margin-left: 18em;
		}

		.invoice-terms .ql-indent-7 {
			margin-left: 21em;
		}

		.invoice-terms .ql-indent-8 {
			margin-left: 24em;
		}

		/* ==========================================================
		   RTL INDENTATION
		   ========================================================== */

		.invoice-terms .ql-direction-rtl.ql-indent-1 {
			margin-left: 0;
			margin-right: 3em;
		}

		.invoice-terms .ql-direction-rtl.ql-indent-2 {
			margin-left: 0;
			margin-right: 6em;
		}

		.invoice-terms .ql-direction-rtl.ql-indent-3 {
			margin-left: 0;
			margin-right: 9em;
		}

		.invoice-terms .ql-direction-rtl.ql-indent-4 {
			margin-left: 0;
			margin-right: 12em;
		}

		.invoice-terms .ql-direction-rtl.ql-indent-5 {
			margin-left: 0;
			margin-right: 15em;
		}

		.invoice-terms .ql-direction-rtl.ql-indent-6 {
			margin-left: 0;
			margin-right: 18em;
		}

		.invoice-terms .ql-direction-rtl.ql-indent-7 {
			margin-left: 0;
			margin-right: 21em;
		}

		.invoice-terms .ql-direction-rtl.ql-indent-8 {
			margin-left: 0;
			margin-right: 24em;
		}

		.invoice-terms blockquote {
			margin: 5px 0 5px 15px;
			padding-left: 8px;
			border-left: 2px solid #ccc;
		}

		/*
		 * Keep this because attachments intentionally start
		 * on a separate PDF page.
		 */
		.page-break-before {
			page-break-before: always;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			page-break-inside: auto;
		}

		thead {
			display: table-header-group;
		}

		tr {
			page-break-inside: avoid;
		}

		.invoice-content {
			position: relative;
			z-index: 1;
		}

		.cancelled-watermark {
			position: fixed;
			top: 42%;
			left: 0;
			right: 0;
			width: 100%;
			text-align: center;
			font-size: 86px;
			font-weight: 700;
			letter-spacing: 8px;
			color: #b00020;
			transform: rotate(-35deg);
			z-index: 9999;
			pointer-events: none;
		}

	</style>
</head>

<body
		style="
			font-family: 'Montserrat', sans-serif;
			background-color: #ffffff;
			color: #000000;
			font-size: 12px;
			line-height: 1.4;
			padding: 0;
			margin: 0;
			box-sizing: border-box;
		">

<div
		class="invoice-content"
		style="
			width: 100%;
			box-sizing: border-box;
		">

	<!-- ===============================
	     PART 1: HEADER
	     =============================== -->

	<div
			th:replace="~{invoice/fragments/header :: invoiceHeader}">
	</div>


	<!-- ===============================
	     PART 2: BILLING INFO
	     =============================== -->

	<div
			th:replace="~{invoice/fragments/billing-info :: billingInfo}">
	</div>


	<!-- ===============================
	     PART 3–6: LINE ITEMS
	     =============================== -->

	<table style="font-size: 11px;">

		<thead
				th:replace="~{invoice/fragments/table-header :: tableHeader}">
		</thead>

		<tbody>

		<th:block
				th:each="entry, stat : ${entries}">

			<tr
					th:replace="~{invoice/fragments/duty-row :: dutyRow(${entry}, ${stat.index + 1})}">
			</tr>

			<th:block
					th:replace="~{invoice/fragments/extra-charges :: extraCharges(${entry})}">
			</th:block>

		</th:block>

		</tbody>

	</table>


	<!-- ===============================
	     PART 7: TOTALS / GST / PAYMENTS
	     =============================== -->

	<div
			th:replace="~{invoice/fragments/totals :: invoiceTotals}">
	</div>


	<!-- ===============================
	     PART 8: FOOTER / LEGAL
	     =============================== -->

	<div
			th:replace="~{invoice/fragments/footer :: invoiceFooter}">
	</div>


	<!-- ===============================
	     PART 9: ATTACHMENTS / SLIPS
	     =============================== -->

	<div
			th:replace="~{invoice/fragments/attachments :: invoiceAttachments(${attachments})}">
	</div>

</div>


<div
		th:if="${invoiceCancelled}"
		class="cancelled-watermark">
	CANCELLED
</div>

</body>
</html>
